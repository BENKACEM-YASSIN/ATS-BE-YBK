spring.application.name=optimizer
spring.profiles.default=local

# Render assigns PORT in cloud. The local profile falls back to 8081.
server.port=${PORT:8081}

# Cloud configuration is supplied through environment variables. Local values
# live only in the ignored application-local.properties file.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable SQL initialization
spring.sql.init.mode=never

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Secrets are never committed. Set these in local ignored configuration or the
# deployment host's environment-variable/secret settings.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
# Quality-first model order. The router only moves down this list when a model
# is unavailable or has a transient server/network failure. It never rotates
# keys or bypasses quota-exceeded responses.
gemini.models=${GEMINI_MODELS:gemini-2.5-pro,gemini-3.8-flash,gemini-3.6-flash,gemini-2.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash-lite}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
# Enable DB-backed profile endpoints
profile.enabled=true

# Frontend URL used for Playwright rendering
frontend.url=${FRONTEND_URL:http://localhost:4200}

# JSearch API Configuration (Optional - for job search)
jsearch.api.key=${JSEARCH_API_KEY:}
jsearch.api.url=${JSEARCH_API_URL:https://jsearch.p.rapidapi.com/search}

# Local use stays open. Set REQUIRE_API_KEY=true and PERSONA_API_KEY in cloud.
app.security.require-api-key=${REQUIRE_API_KEY:false}
app.security.api-key=${PERSONA_API_KEY:}
